[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ak-asc"
version = "0.1.2"
description = "Appknox fork of Droid ASC: a fast on-demand Android decompiler, with correct MUTF-8 decoding for obfuscated classes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
maintainers = [{ name = "Appknox" }]
dependencies = [
    "androguard>=4.1.3",
]

[project.urls]
Homepage = "https://github.com/appknox/ak-asc"
Upstream = "https://github.com/MG1937/ASC"

[project.scripts]
droidasc = "droidasc:main"

[tool.setuptools.packages.find]
include = ["droidasc", "droidasc.*"]

[tool.setuptools.package-data]
"droidasc" = ["py.typed"]